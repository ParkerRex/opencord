name: OpenCordUIKitApp
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "16.0"
packages:
  OpenCordUIKit:
    path: ../OpenCordUIKit
targets:
  OpenCordUIKitApp:
    type: application
    platform: iOS
    sources:
      - path: OpenCordUIKitApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opencord.uikit
        PRODUCT_NAME: OpenCordUIKitApp
        SWIFT_VERSION: 5.10
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenCord
    dependencies:
      - package: OpenCordUIKit
        product: OpenCordClientCore
      - package: OpenCordUIKit
        product: OpenCordNetworking
      - package: OpenCordUIKit
        product: OpenCordUIKitShell
schemes:
  OpenCordUIKitApp:
    build:
      targets:
        OpenCordUIKitApp: all
    run:
      config: Debug
